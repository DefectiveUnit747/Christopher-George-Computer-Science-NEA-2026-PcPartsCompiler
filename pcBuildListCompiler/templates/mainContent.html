<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Preference Selector</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <script src="{{ url_for('static', filename='particles/particles.min.js') }}"></script>
</head>
<body>
    <div id="particles-js"></div>

    <div class = "mainPageFlexContainer">

        <div class = "box">
            <label for="budgetSlider"><strong>Budget: </strong>£<span id="budgetValue">1000</span></label>
            <input type="range" id="budgetSlider" min="600" max="5000" step="50" value="2800">
            <br><br>

            <label for="aestheticSlider"><strong>Aesthetic Preference (1 - 5): </strong><span id="aestheticsValue">3</span></label>
            <input type="range" id="aestheticSlider" min="1" max="5" step="1" value="3">
            <br><br>

            <label for="futureSlider"><strong>Future Flexibility (1 - 5): </strong><span id="futureValue">3</span></label>
            <input type="range" id="futureSlider" min="1" max="5" step="1" value="3">
            <br>

            <div class="brand-selector">
            <h3><label>GPU Brand Preference:</label></h3>
            <div class="button-group">
                <button id="btn-any" data-brand = "any">Any</button>
                <button id="btn-nvidia" data-brand = "nvidia">NVIDIA</button>
                <button id="btn-intel" data-brand = "intel">Intel</button>
                <button id="btn-amd" data-brand = "amd">AMD</button>
            </div> <br>
        </div>

        </div>

        <div class = "box">
            <div class="searchForGamesBar">
            <input type="text" id="gameSearchBar" placeholder="Search for a game">
            <!-- <button onclick="searchGame()">Click</button> -->
            <br><br>
            <div id="gamePreview"></div>
            <div id = "searchSuggestion"></div>
            <br><br><br><br><br><br><br><br><br><br><br><br>
            <button id="mainContentPageButton">Click to Continue</button>
            </div>
        </div>

    </div>

    <script src="{{ url_for('static', filename='app.js') }}"></script>
    <script>
        document.addEventListener("DOMContentLoaded", () => {
            particlesJS.load('particles-js', '{{ url_for("static", filename="particles/particles-config.json") }}', () => {
                console.log('particles.js config loaded');
            });
        });
    </script>
</body>
</html>
